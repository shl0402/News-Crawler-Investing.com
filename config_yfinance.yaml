# SCRAPER CONFIGURATION
start_date: "2025-01-01"
end_date: "2026-03-11"
limit_items: 10000
daily_limit: 10  # <-- NEW: Maximum number of news articles to scrape per day
headless: true

# CONCURRENCY SETTINGS
# Google is strict about bots. Keep this at 1 or 2.
max_concurrent: 1

# RESUME DATES (Optional)
# Specify a starting date (YYYY-MM-DD) for specific stocks.
# The scraper goes backward in time. If the CSV report shows a date further back, 
# it will automatically use the CSV date instead to prevent re-scraping.
# RESUME DATES (Optional)
# Specify a starting date (YYYY-MM-DD) for specific stocks.
